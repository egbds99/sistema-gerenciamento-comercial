{% extends "base.html" %}{% block content %}<p class="eyebrow">Operação</p><h1>Registrar venda</h1><section class="panel formpanel"><form method="post" action="{{url_for('sales.registrar')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label for="produto_id">Produto *</label><select id="produto_id" name="produto_id" required><option value="">Selecione um produto</option>{% for p in produtos if p.quantidade_estoque>0 %}<option value="{{p.id_produto}}">{{p.nome}} — R$ {{'%.2f'|format(p.preco)}} ({{p.quantidade_estoque}} disponíveis)</option>{% endfor %}</select><label for="quantidade">Quantidade *</label><input id="quantidade" name="quantidade" type="number" min="1" required value="1"><p class="hint">O estoque será verificado antes da confirmação.</p><div class="buttons"><a class="button" href="{{url_for('main.dashboard')}}">Cancelar</a><button class="primary">Confirmar venda</button></div></form></section>{% endblock %}
