{% extends "base.html" %}{% block content %}<p class="eyebrow">Catálogo</p><h1>Cadastrar produto</h1><section class="panel formpanel"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label for="nome">Nome do produto *</label><input id="nome" name="nome" maxlength="120" required><label for="categoria">Categoria</label><input id="categoria" name="categoria" maxlength="60"><label for="preco">Preço (R$) *</label><input id="preco" name="preco" type="number" min="0" step=".01" required><label for="quantidade_estoque">Quantidade inicial *</label><input id="quantidade_estoque" name="quantidade_estoque" type="number" min="0" required value="0"><label for="estoque_minimo">Estoque mínimo *</label><input id="estoque_minimo" name="estoque_minimo" type="number" min="0" required value="0"><div class="buttons"><a class="button" href="{{url_for('products.index')}}">Cancelar</a><button class="primary">Salvar produto</button></div></form></section>{% endblock %}
